<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" font-family="sans-serif">
  <rect width="940" height="590" fill="#e9ecef"/>
  <text x="470" y="26" text-anchor="middle" font-size="15" fill="#333">FitNotes — restyled to Progression's look (1px = 1dp)</text>

  <!-- BEFORE -->
  <g transform="translate(30,40)">
    <clipPath id="pb"><rect width="432" height="500" rx="16"/></clipPath>

      <rect width="432" height="24" fill="#0b0d0f"/>
      <text x="14" y="17" font-size="12" fill="#fff">9:32</text>
      <rect y="24" width="432" height="56" fill="#23262c"/>
      <rect x="12" y="34" width="36" height="36" rx="6" fill="#3d7fd6"/>
      <text x="58" y="59" font-size="19" fill="#f2f2f2">Romanian Deadlift</text>
      <rect y="80" width="432" height="48" fill="#1b1e22"/>
      <text x="72" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">TRACK</text>
      <text x="216" y="110" text-anchor="middle" font-size="15" fill="#9aa0a6">HISTORY</text>
      <text x="360" y="110" text-anchor="middle" font-size="15" fill="#9aa0a6">GRAPH</text>
      <rect y="124" width="144" height="4" fill="#35b3e8"/>
      <text x="20" y="152" font-size="14" fill="#cfd3d7">WEIGHT (lbs)</text>
      <rect x="20" y="158" width="392" height="2" fill="#35b3e8"/>
      <rect x="96" y="166" width="52" height="42" rx="3" fill="#2b323b"/>
      <text x="122" y="194" text-anchor="middle" font-size="24" fill="#e8e8e8">−</text>
      <text x="216" y="200" text-anchor="middle" font-size="30" font-weight="bold" fill="#ececec">115.0</text>
      <rect x="284" y="166" width="52" height="42" rx="3" fill="#2b323b"/>
      <text x="310" y="196" text-anchor="middle" font-size="28" fill="#e8e8e8">+</text>
      <text x="20" y="240" font-size="14" fill="#cfd3d7">REPS</text>
      <rect x="20" y="246" width="392" height="2" fill="#35b3e8"/>
      <rect x="96" y="254" width="52" height="42" rx="3" fill="#2b323b"/>
      <text x="216" y="288" text-anchor="middle" font-size="30" font-weight="bold" fill="#ececec">10</text>
      <rect x="284" y="254" width="52" height="42" rx="3" fill="#2b323b"/>
      <rect x="20" y="318" width="190" height="52" rx="4" fill="#26a97c"/>
      <text x="115" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">SAVE</text>
      <rect x="222" y="318" width="190" height="52" rx="4" fill="#3d8fc9"/>
      <text x="317" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">CLEAR</text>
      <rect x="26" y="398" width="20" height="14" rx="3" fill="#b9bec4"/>
      <text x="100" y="416" text-anchor="middle" font-size="17" font-weight="bold" fill="#ececec">3</text>
      <text x="236" y="416" text-anchor="middle" font-size="16" fill="#dfe3e7">115.0 lbs</text>
      <text x="376" y="416" text-anchor="middle" font-size="16" fill="#dfe3e7">9 reps</text>
      <line x1="20" y1="434" x2="412" y2="434" stroke="#33373c"/>
      <rect x="26" y="446" width="20" height="14" rx="3" fill="#b9bec4"/>
      <text x="100" y="464" text-anchor="middle" font-size="17" font-weight="bold" fill="#ececec">4</text>
      <text x="236" y="464" text-anchor="middle" font-size="16" fill="#dfe3e7">115.0 lbs</text>
      <text x="376" y="464" text-anchor="middle" font-size="16" fill="#dfe3e7">10 reps</text>
    </g>
  </g>
  <text x="246" y="562" text-anchor="middle" font-size="13" fill="#444">BEFORE — current FitNotes look</text>

  <!-- AFTER: Progression style -->
  <g transform="translate(478,40)">
    <clipPath id="pa"><rect width="432" height="500" rx="16"/></clipPath>
    <rect width="432" height="500" rx="16" fill="#0d0f14" stroke="#555" stroke-width="2"/>
    <g clip-path="url(#pa)">
      <rect width="432" height="24" fill="#0a0c10"/>
      <text x="14" y="17" font-size="12" fill="#fff">9:32</text>
      <rect y="24" width="432" height="56" fill="#0d0f14"/>
      <text x="20" y="59" font-size="19" fill="#e8eaed">Romanian Deadlift</text>
      <circle cx="404" cy="52" r="12" fill="#1e232b"/>
      <text x="404" y="56" text-anchor="middle" font-size="11" fill="#9aa0a6">⋮</text>
      <rect y="80" width="432" height="44" fill="#0d0f14"/>
      <text x="72" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6ff0">TRACK</text>
      <text x="216" y="107" text-anchor="middle" font-size="14" fill="#9aa0a6">HISTORY</text>
      <text x="360" y="107" text-anchor="middle" font-size="14" fill="#9aa0a6">GRAPH</text>
      <rect y="122" width="144" height="3" rx="1.5" fill="#3d6ff0"/>

      <!-- history card -->
      <rect x="14" y="136" width="404" height="216" rx="12" fill="#161a21"/>
      <circle cx="40" cy="166" r="14" fill="#3d6ff0"/>
      <text x="40" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
      <text x="80" y="172" font-size="15" fill="#e8eaed">115.0 lbs</text>
      <text x="396" y="172" text-anchor="end" font-size="15" fill="#9aa0a6">9 reps</text>
      <circle cx="40" cy="216" r="14" fill="#3d6ff0"/>
      <text x="40" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">4</text>
      <text x="80" y="222" font-size="15" fill="#e8eaed">115.0 lbs</text>
      <text x="396" y="222" text-anchor="end" font-size="15" fill="#9aa0a6">10 reps</text>
      <circle cx="40" cy="266" r="14" fill="#9aa0a6" opacity="0.35"/>
      <text x="40" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#9aa0a6">5</text>
      <text x="80" y="272" font-size="15" fill="#e8eaed">117.5 lbs</text>
      <text x="396" y="272" text-anchor="end" font-size="15" fill="#9aa0a6">8 reps</text>
      <circle cx="40" cy="316" r="14" fill="#9aa0a6" opacity="0.35"/>
      <text x="40" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#9aa0a6">6</text>
      <text x="80" y="322" font-size="15" fill="#e8eaed">117.5 lbs</text>
      <text x="396" y="322" text-anchor="end" font-size="15" fill="#9aa0a6">8 reps</text>

      <!-- form: caps labels + rounded input boxes -->
      <text x="24" y="382" font-size="11" font-weight="bold" fill="#9aa0a6">WEIGHT (LBS)</text>
      <text x="226" y="382" font-size="11" font-weight="bold" fill="#9aa0a6">REPS</text>
      <rect x="14" y="390" width="196" height="52" rx="10" fill="#1e232b"/>
      <text x="38" y="424" text-anchor="middle" font-size="20" fill="#9aa0a6">−</text>
      <text x="112" y="425" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8eaed">115.0</text>
      <text x="186" y="424" text-anchor="middle" font-size="20" fill="#3d6ff0">+</text>
      <rect x="222" y="390" width="196" height="52" rx="10" fill="#1e232b"/>
      <text x="246" y="424" text-anchor="middle" font-size="20" fill="#9aa0a6">−</text>
      <text x="320" y="425" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8eaed">10</text>
      <text x="394" y="424" text-anchor="middle" font-size="20" fill="#3d6ff0">+</text>

      <!-- bottom pills: gray left, blue right -->
      <rect x="14" y="456" width="196" height="40" rx="20" fill="#23272e"/>
      <text x="112" y="481" text-anchor="middle" font-size="14" font-weight="bold" fill="#9aa0a6">CLEAR</text>
      <rect x="222" y="456" width="196" height="40" rx="20" fill="#3d6ff0"/>
      <text x="320" y="481" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">SAVE</text>
    </g>
    <rect x="6" y="134" width="420" height="372" fill="none" stroke="#ffe082" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="694" y="562" text-anchor="middle" font-size="13" fill="#444">AFTER — Progression-style: card list, no dividers, boxed inputs, blue primary</text>
</svg>